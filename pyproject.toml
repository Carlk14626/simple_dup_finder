[project]
name = "simple-dup-finder"
version = "0.1.1"
description = "Identify duplicate files by comparing sizes first, then SHA-256 hashes only when needed."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
